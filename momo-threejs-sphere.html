<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" class=""></head>
<body class="bg-white" style="background: rgb(255, 255, 255); width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif;">
<!-- STITCH_THREEJS_START:ANIMATION_12 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_12" style="width:100%;height:100%"><canvas width="1600" height="1280" style="display: block; width: 1280px; height: 1024px;"></canvas></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_12');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 600;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Master Group for responsive floating & mouse tracking
const masterGroup = new THREE.Group();
scene.add(masterGroup);

// Vertex Shader
const vertexShader = `
  varying vec3 vNormal;
  varying vec3 vPosition;
  varying vec3 vViewPosition;

  void main() {
    vNormal = normalize(normalMatrix * normal);
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    vPosition = position;
    vViewPosition = -mvPosition.xyz;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

// Fragment Shader for Charcoal Black Smoked-Glass / Satin-Metal Sphere
const fragmentShader = `
  varying vec3 vNormal;
  varying vec3 vPosition;
  varying vec3 vViewPosition;
  uniform float u_time;
  uniform vec2 u_mouse;

  void main() {
    vec3 N = normalize(vNormal);
    vec3 V = normalize(vViewPosition);

    // Color definitions from specifications:
    // Base colour: Charcoal black #1F1F1F -> rgb(0.121, 0.121, 0.121)
    // Shadow colour: Deep black #08090B -> rgb(0.031, 0.035, 0.043)
    // Highlight colour: Soft silver-grey #AEB3BA -> rgb(0.682, 0.702, 0.729)
    vec3 cBase = vec3(0.121, 0.121, 0.121);
    vec3 cShadow = vec3(0.031, 0.035, 0.043);
    vec3 cHighlight = vec3(0.682, 0.702, 0.729);
    vec3 cPureWhite = vec3(0.92, 0.94, 0.96);

    // Primary directional light: upper-right, tilted slightly forward
    vec3 lightDir1 = normalize(vec3(0.7, 0.85, 0.75));
    // Soft fill light: gentle lower-left
    vec3 lightDir2 = normalize(vec3(-0.6, -0.4, 0.5));

    // Smooth Lambertian / Diffuse falloff
    float NdotL1 = dot(N, lightDir1);
    float diff1 = smoothstep(-0.25, 0.9, NdotL1);
    float diff2 = max(dot(N, lightDir2), 0.0) * 0.15;

    // Deep curved gradient from Deep Black into Charcoal Black
    vec3 col = mix(cShadow, cBase, diff1);
    col += cBase * diff2;

    // Ambient occlusion toward the bottom and shadow core
    float ao = smoothstep(-1.0, 0.5, N.y * 0.7 + N.z * 0.3);
    col = mix(cShadow * 0.8, col, ao);

    // Broad, diffused silver-white reflection across upper-right area
    vec3 H1 = normalize(lightDir1 + V);
    float NdotH1 = max(dot(N, H1), 0.0);
    // Broad lobe for satin sheen
    float broadSpec = pow(NdotH1, 8.0) * 0.35;
    // Core focused specular reflection
    float sharpSpec = pow(NdotH1, 42.0) * 0.65;
    col += cHighlight * broadSpec + cPureWhite * sharpSpec;

    // Subtle curved reflections following the sphere's surface (soft secondary reflection)
    vec3 R = reflect(-V, N);
    // Upper secondary curvature highlight
    float curvedGlance = smoothstep(0.4, 0.95, R.y * 0.6 + R.x * 0.5) * 0.18;
    col += cHighlight * curvedGlance;

    // Fresnel & Thin, soft silver-grey rim light around circumference
    float fresnel = 1.0 - max(dot(N, V), 0.0);
    // Rim light falls off softly right at the glancing edges
    float rim = smoothstep(0.55, 0.96, fresnel);
    col = mix(col, col + cHighlight * 0.75, rim);

    // Subtle smoked-glass inner depth gradient (smooth, no noise/grain)
    float innerGlow = smoothstep(0.8, 0.0, length(vPosition.xy) / 2.0) * 0.04;
    col += cHighlight * innerGlow;

    gl_FragColor = vec4(col, 1.0);
  }
`;

// Primary Charcoal Black Sphere
const orbGeo = new THREE.SphereGeometry(2.0, 128, 128);
const orbUniforms = {
  u_time: { value: 0 },
  u_mouse: { value: new THREE.Vector2(0, 0) }
};
const orbMat = new THREE.ShaderMaterial({
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  uniforms: orbUniforms,
  transparent: false
});
const orbMesh = new THREE.Mesh(orbGeo, orbMat);
masterGroup.add(orbMesh);

// Outer Clear Smoked-Glass Shell for polished physical reflections and depth
const glassGeo = new THREE.SphereGeometry(2.02, 128, 128);
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x1F1F1F,
  metalness: 0.25,
  roughness: 0.12,
  transmission: 0.45,
  thickness: 0.35,
  transparent: true,
  opacity: 0.32,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08
});
const glassMesh = new THREE.Mesh(glassGeo, glassMat);
masterGroup.add(glassMesh);

// Twin Pill-Shaped White Eyes (Capsules)
function createPillEye(xOffset) {
  const eyeGroup = new THREE.Group();
  const cylinderGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.32, 32);
  const capGeo = new THREE.SphereGeometry(0.13, 32, 16);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const cyl = new THREE.Mesh(cylinderGeo, eyeMat);
  const topCap = new THREE.Mesh(capGeo, eyeMat);
  topCap.position.y = 0.16;
  const botCap = new THREE.Mesh(capGeo, eyeMat);
  botCap.position.y = -0.16;

  eyeGroup.add(cyl);
  eyeGroup.add(topCap);
  eyeGroup.add(botCap);
  eyeGroup.position.set(xOffset, 0.12, 2.05);
  return eyeGroup;
}

const leftEye = createPillEye(-0.25);
const rightEye = createPillEye(0.25);
masterGroup.add(leftEye);
masterGroup.add(rightEye);

// Studio Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xAEB3BA, 1.8);
dirLight1.position.set(4, 5, 4);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xAEB3BA, 0.5);
dirLight2.position.set(-3, -2, 2);
scene.add(dirLight2);

// Smooth Cursor Interaction
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;
const halfW = window.innerWidth / 2;
const halfH = window.innerHeight / 2;

function onMouseMove(e) {
  mouseX = (e.clientX - halfW) * 0.001;
  mouseY = (e.clientY - halfH) * 0.001;
  orbUniforms.u_mouse.value.set(e.clientX, e.clientY);
}
window.addEventListener('mousemove', onMouseMove);

function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 600;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  orbUniforms.u_time.value = elapsedTime;

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  masterGroup.rotation.y = targetX * 1.2 + Math.sin(elapsedTime * 0.4) * 0.05;
  masterGroup.rotation.x = targetY * 1.2 + Math.cos(elapsedTime * 0.35) * 0.04;
  masterGroup.position.y = Math.sin(elapsedTime * 0.8) * 0.06;

  // Eye blink animation
  const blinkCycle = Math.sin(elapsedTime * 0.8);
  if (blinkCycle > 0.985) {
    leftEye.scale.y = 0.15;
    rightEye.scale.y = 0.15;
  } else {
    leftEye.scale.y = 1.0;
    rightEye.scale.y = 1.0;
  }

  renderer.render(scene, camera);
}
animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_12 -->

ll duration-200 bg-cyan-400/20 text-cyan-300 border border-cyan-400/40'; } else { btn.className = 'state-pill px-3 py-1 text-xs rounded-full font-medium transition-all duration-200 text-gray-400 hover:text-white'; } }); if(state === 'Listening') { statusText.textContent = 'Listening...'; pulseRing.className = 'absolute -inset-3 rounded-full bg-cyan-400/30 blur-md opacity-100 animate-pulse transition-opacity duration-300'; micBtn.style.borderColor = 'rgba(0, 240, 255, 0.7)'; micBtn.style.backgroundColor = '#16282B'; micIcon.textContent = 'mic'; wave.classList.remove('hidden'); } else if(state === 'Thinking') { statusText.textContent = 'Processing thoughts...'; pulseRing.className = 'absolute -inset-3 rounded-full bg-purple-500/30 blur-md opacity-100 animate-pulse transition-opacity duration-300'; micBtn.style.borderColor = 'rgba(180, 100, 255, 0.6)'; micBtn.style.backgroundColor = '#23162b'; micIcon.textContent = 'psychology'; wave.classList.add('hidden'); } else if(state === 'Speaking') { statusText.textContent = 'Spherical AI is speaking...'; pulseRing.className = 'absolute -inset-3 rounded-full bg-teal-400/20 blur-md opacity-100 transition-opacity duration-300'; micBtn.style.borderColor = 'rgba(45, 212, 191, 0.6)'; micBtn.style.backgroundColor = '#162b25'; micIcon.textContent = 'volume_up'; wave.classList.remove('hidden'); } else if(state === 'Stopped') { statusText.textContent = 'Microphone muted'; pulseRing.className = 'absolute -inset-3 rounded-full opacity-0 transition-opacity duration-300'; micBtn.style.borderColor = 'rgba(255, 100, 100, 0.4)'; micBtn.style.backgroundColor = '#261515'; micIcon.textContent = 'mic_off'; wave.classList.add('hidden'); } else { statusText.textContent = 'Tap microphone to speak'; pulseRing.className = 'absolute -inset-3 rounded-full bg-cyan-400/20 blur-md opacity-0 transition-opacity duration-300'; micBtn.style.borderColor = 'rgba(255, 255, 255, 0.15)'; micBtn.style.backgroundColor = '#1F1F1F'; micIcon.textContent = 'mic'; wave.classList.add('hidden'); } } let isListening = false; function toggleMic() { isListening = !isListening; setState(isListening ? 'Listening' : 'Idle'); } window.setState = setState; window.toggleMic = toggleMic; <\/script></div></script></div></body></html>
