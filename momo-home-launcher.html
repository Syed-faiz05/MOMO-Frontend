<style data-purpose="3d-momo-sphere">
    /* 3D Rendered Sphere for Momo */
    .momo-sphere {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 35% 32%, #43464C 0%, #202226 28%, #111215 56%, #050608 100%);
      box-shadow: 
        inset 2px 3px 6px rgba(255, 255, 255, 0.32),
        inset -5px -6px 14px rgba(0, 0, 0, 0.85),
        inset -1px -2px 5px rgba(255, 255, 255, 0.12),
        0 18px 28px -6px rgba(0, 0, 0, 0.38),
        0 6px 12px rgba(0, 0, 0, 0.22);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    /* Glossy specular top-right highlight */
    .momo-sphere::before {
      content: '';
      position: absolute;
      top: 24px;
      right: 34px;
      width: 17px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.45) 50%, rgba(255, 255, 255, 0) 100%);
      filter: blur(0.7px);
      transform: rotate(-15deg);
    }

    /* Lower subtle diffuse bounce reflection */
    .momo-sphere::after {
      content: '';
      position: absolute;
      bottom: 44px;
      left: 30px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 80%);
      filter: blur(0.6px);
    }

    /* Floating subtle animation */
    @keyframes subtleFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.01);
      }
    }

    .momo-animated {
      animation: subtleFloat 4.2s ease-in-out infinite;
    }

    /* Momo Capsule Eyes */
    .momo-eye {
      width: 9.5px;
      height: 25px;
      background-color: #FFFFFF;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
      transition: transform 0.2s ease, height 0.2s ease;
    }

    .momo-sphere:hover .momo-eye {
      box-shadow: 0 0 14px rgba(255, 255, 255, 1);
    }
  </style>

<script data-purpose="momo-interactivity">
    // Interactive blink and reaction for Momo's sphere
    const orb = document.getElementById('momoOrb');
    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');

    function blink() {
      if (!leftEye || !rightEye) return;
      leftEye.style.transform = 'scaleY(0.1)';
      rightEye.style.transform = 'scaleY(0.1)';
      
      setTimeout(() => {
        leftEye.style.transform = 'scaleY(1)';
        rightEye.style.transform = 'scaleY(1)';
      }, 160);
    }

    // Random blinking intervals
    function scheduleBlink() {
      const nextInterval = Math.random() * 4000 + 2500;
      setTimeout(() => {
        blink();
        scheduleBlink();
      }, nextInterval);
    }
    scheduleBlink();

    // Click wave trigger
    orb.addEventListener('click', () => {
      orb.style.transform = 'scale(0.85)';
      setTimeout(() => {
        orb.style.transform = 'scale(0.9)';
      }, 200);
    });
  </script>
<script data-purpose="clock-time-updater">
    // Keep reference date default: 28 Oct, Fri, 2026 as showcased in layout
    const clockEl = document.getElementById('liveClock');
    const dateEl = document.getElementById('liveDate');

    const ENABLE_REALTIME = false;

    if (ENABLE_REALTIME) {
      function updateLiveTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${hours}:${minutes}`;

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        
        const dayName = days[now.getDay()];
        const dayNum = now.getDate();
        const monthName = months[now.getMonth()];
        const year = now.getFullYear();

        dateEl.textContent = `${dayNum} ${monthName}, ${dayName}, ${year}`;
      }
      setInterval(updateLiveTime, 1000);
      updateLiveTime();
    }
  </script>
